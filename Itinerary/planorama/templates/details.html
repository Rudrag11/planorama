<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Itinerary</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: rgb(244, 224, 200);
        }

        .itinerary-main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1%;
            background-color: rgb(244, 224, 200);
        }

        .form {
            background-color: #fff;
            padding: 2%;
            max-width: 400px;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            font-size: 30px;
            text-align: center;
            font-weight: 600;
            color: rgba(199, 56, 56, 0.845);
            margin-bottom: 20px;
        }

        .input-container {
            margin-bottom: 15px;
        }

        .input-container label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 5px;
            color: rgba(199, 56, 56, 0.845);
        }

        .input-container input,
        .input-container select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .submit {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: rgba(199, 56, 56, 0.845);
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit:hover {
            background-color: rgba(184, 31, 31, 0.86);
        }
    </style>
</head>
<body>

<div class="itinerary-main">
    <form class="form" action="/generate-itinerary" method="post">
        <p class="form-title">Generate Itinerary</p>

        <div class="input-container">
            <label for="budget">Budget per day (Rs.)</label>
            <input type="number" id="budget" name="budget" required>
        </div>

        <div class="input-container">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" name="startDate" required>
        </div>

        <div class="input-container">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" name="endDate" required>
        </div>

        <div class="input-container">
            <label for="numPeople">Number of People</label>
            <input type="number" id="numPeople" name="numPeople" min="1" required>
        </div>

        <div class="input-container">
            <label for="minRating">Minimum Rating (1-5)</label>
            <input type="number" id="minRating" name="minRating" min="1" max="5" required>
        </div>

        

        <button class="submit" type="submit">Generate Itinerary</button>
    </form>
</div>

<script>
    function generateItinerary(event) {
        event.preventDefault();
        alert('Itinerary generated successfully!');
    }
</script>

</body>
</html>
