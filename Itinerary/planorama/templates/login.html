<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    .login-main {
      height: 100vh;
      overflow: hidden;
      padding-left: 1%;
      padding-right: 1%;
      background-color: rgb(244, 224, 200);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form {
      background-color: #fff;
      display: block;
      padding: 2%;
      max-width: 350px;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .form-title {
      font-size: 35px;
      line-height: 1.75rem;
      font-weight: 600;
      text-align: center;
      color: rgba(199, 56, 56, 0.845);
    }

    .input-container {
      position: relative;
    }

    .input-container input, .form button {
      outline: none;
      border: 1px solid #e5e7eb;
      margin: 8px 0;
    }

    .input-container input {
      background-color: #fff;
      padding: 1rem;
      padding-right: 3rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      width: 300px;
      border-radius: 0.5rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .input-container span {
      display: grid;
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      padding-left: 1rem;
      padding-right: 1rem;
      place-content: center;
    }

    .input-container span svg {
      color: #9CA3AF;
      width: 1rem;
      height: 1rem;
    }

    .submit {
      display: block;
      padding: 0.75rem 1.25rem;
      background-color: rgba(199, 56, 56, 0.845);
      color: #ffffff;
      font-size: 0.875rem;
      line-height: 1.25rem;
      font-weight: 500;
      width: 100%;
      border-radius: 0.5rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit:hover {
      background-color: rgba(184, 31, 31, 0.86);
    }

    .signup-link {
      color: #6B7280;
      font-size: 0.875rem;
      line-height: 1.25rem;
      text-align: center;
    }

    .signup-link a {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-main">
    <form class="form" action="/whereto" method="post" id="login-form">
      <p class="form-title">Welcome Back!</p>
      <div class="input-container">
        <input placeholder="Enter username" type="text" name="username" required />
      </div>
      <div class="input-container">
        <input placeholder="Enter password" type="password" name="password" required />
      </div>
      <button class="submit" type="submit">
        Login
      </button>
      <p class="signup-link">
        No account? <a href="/signup">Sign up</a>
      </p>
    </form>
  </div>

</body>
</html>
