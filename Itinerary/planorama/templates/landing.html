<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANORAMA</title>
  <style>
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-left: 1%;
      padding-right: 1%;
      background-color: rgb(244, 224, 200);
    }
    .header {
      font-size: larger;
      height: 15%;
      display: flex;
      flex-direction: row;
      gap: 90%;
      margin: 0;
    }
    .header h2 {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 2px;
    }
    .landingbody {
      border-radius: 10px;
      height: 75%;
      font-size: 100px;
      text-align: left;
      margin: 0;
      line-height: 20px;
      font-family: 'landing-font';
      color: rgba(199, 56, 56, 0.845);
    }
    .landingbody img {
      height: 500px;
      width: 500px;
      position: absolute;
      top: 100px;
      right: 100px;
    }
    .Options button {
      font-size: 20px;
      letter-spacing: 1px;
      background: none;
      color: rgba(199, 56, 56, 0.845);
      border: 2px solid rgba(174, 39, 39, 0.949);
      border-radius: 20px;
      height: 60px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .Get-started {
      width: 150px;
      margin-right: 20px;
    }
    .Login-btn {
      width: 100px;
      margin: 20px;
    }
    .Get-started:hover,
    .Login-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>PLANORAMA</h2>
  </div>

  <div class="landingbody">
    <p>Map Your Adventure,</p>
    <p>Seamlessly!</p>
    <img src="./static/landing pic.png" alt="logo"/>
    <div class="Options">
      <a href="/signup"><button class="Get-started" >Get Started</button></a>
      <a href="/login"><button class="Login-btn" >Login</button></a>
    </div>
  </div>

</body>
</html>
